name: build and test
on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
      - develop

jobs:
  buildandtest:
    name: Build and Test on Go ${{matrix.go}}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go: [ 'stable', 'oldstable' ]

    steps:
      - name: Set up Go ${{matrix.go}}
        uses: actions/setup-go@41dfa10bad2bb2ae585af6ee5bb4d7d973ad74ed # pin@v5
        with:
          go-version: ${{matrix.go}}
        id: go

      - name: Check out code into the Go module directory
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # pin@v4

      - name: Test Go packages
        run: |
          go build -race -tags plugger_dynamic -buildmode=plugin -o example/dynplug/dynplug.so ./example/dynplug
          go test -v -race -p=1 -count=1 -tags plugger_dynamic ./...
